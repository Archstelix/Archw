<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi, I'm YourName</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
    }

    /* 4 portrait photos */
    .collage {
      position: fixed;
      inset: 0;
      z-index: -2;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* phones: 2x2 */
    @media (max-width: 700px) {
      .collage { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
    }

    /* Dark + blur layer */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 12vh 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    h1 { font-size: 2.6em; margin: 0 0 8px; }
    .tagline { opacity: 0.75; margin: 0 0 28px; }
    h2 { margin: 28px 0 8px; font-size: 1.2em; letter-spacing: 1px; text-transform: uppercase; opacity: 0.9; }
    p, li { line-height: 1.7; }
    a { color: #ffd1b3; }
  </style>
</head>
<body>

  <div class="collage">
    <img src="Upload/imagelilith1.png" alt="">
    <img src="Upload/imagelilith2.png" alt="">
    <img src="Upload/imagelilith3.png" alt="">
    <img src="Upload/imagelilith4.png" alt="">
  </div>
  <div class="overlay"></div>

  <main>
    <div class="card">
      <h1>Hi, I'm YourName</h1>
      <p class="tagline">One short line about you.</p>

      <h2>About me</h2>
      <p>Write a few sentences about yourself here.</p>

      <h2>Things I like</h2>
      <ul>
        <li>Something you enjoy</li>
        <li>Another thing</li>
      </ul>

      <h2>Say hi</h2>
      <p><a href="mailto:you@example.com">you@example.com</a></p>
    </div>
  </main>

</body>
</html>
